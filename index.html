<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>墨鍵道場 · 形碼肌肉記憶遊戲</title>
    <meta name="description" content="專為形碼輸入法打造的節奏型肌肉記憶打字遊戲：融合漸隱鷹架、自適應弱鍵記憶曲線、60fps 疾風落字與自定義碼表即時匯入。" />
    <meta property="og:title" content="墨鍵道場 · 形碼肌肉記憶遊戲" />
    <meta property="og:description" content="專為形碼輸入法打造的節奏型肌肉記憶打字遊戲：融合漸隱鷹架、自適應弱鍵記憶曲線、60fps 疾風落字與自定義碼表即時匯入。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0E1218] text-[#F2EEE6] antialiased selection:bg-[#D94A38]/30 selection:text-[#F2EEE6] overflow-hidden">
    <!-- Hidden SVG paper-fiber noise filters for Xuan-paper ink bleed text rendering in .wash theme -->
    <svg
      aria-hidden="true"
      width="0"
      height="0"
      style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;"
    >
      <defs>
        <!-- Subtle Xuan-paper fiber micro-bleed for general body & UI typography -->
        <filter id="wash-ink-bleed-soft" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="7" result="fiberNoise" />
          <feDisplacementMap in="SourceGraphic" in2="fiberNoise" scale="0.46" xChannelSelector="R" yChannelSelector="G" result="inkEdge" />
          <feGaussianBlur in="inkEdge" stdDeviation="0.24" result="capillaryBlur" />
          <feComponentTransfer in="capillaryBlur" result="softHalo">
            <feFuncA type="linear" slope="0.26" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="softHalo" />
            <feMergeNode in="inkEdge" />
          </feMerge>
        </filter>
        <!-- Richer capillary Xuan-paper ink soak for display titles, serif radicals & SVG calligraphy -->
        <filter id="wash-ink-bleed-display" x="-6%" y="-8%" width="112%" height="116%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="3" seed="11" result="fiberNoise" />
          <feDisplacementMap in="SourceGraphic" in2="fiberNoise" scale="0.88" xChannelSelector="R" yChannelSelector="G" result="inkEdge" />
          <feGaussianBlur in="inkEdge" stdDeviation="0.42" result="capillaryBlur" />
          <feComponentTransfer in="capillaryBlur" result="softHalo">
            <feFuncA type="linear" slope="0.34" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="softHalo" />
            <feMergeNode in="inkEdge" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
